[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "post-quantam-backend"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "cryptography>=42,<45",
  "PyJWT>=2.8,<3",
  "pwdlib[argon2]>=0.2,<1",
]

[project.optional-dependencies]
crypto = ["liboqs-python>=0.12"]
dev = ["httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
