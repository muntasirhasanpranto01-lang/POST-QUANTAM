[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "post-quantam-backend"
version = "0.7.0"
description = "Post-quantum cryptography control-plane API"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "cryptography>=42,<45",
  "PyJWT>=2.8,<3",
  "pwdlib[argon2]>=0.2,<1",
]

[project.optional-dependencies]
crypto = ["liboqs-python>=0.12"]
dev = ["httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
pqctool = "pq_backend.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pq_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
