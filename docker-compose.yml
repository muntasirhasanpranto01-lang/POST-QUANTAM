services:
  api:
    build:
      context: ./backend
    image: post-quantam-api:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      PQ_ENV: production
      PQ_DATA_DIR: /var/lib/post-quantam
      PQ_DATABASE: /var/lib/post-quantam/post_quantam.sqlite3
      PQ_CA_STATE: /var/lib/post-quantam/ca-state.json
    volumes:
      - post_quantam_data:/var/lib/post-quantam
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  post_quantam_data:
